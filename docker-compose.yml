services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_crud_app
    restart: unless-stopped
    init: true
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: clinic_crud
      DB_USERNAME: clinic_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mysql:8.4
    container_name: clinic_crud_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinic_crud
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - clinic_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u clinic_user -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  clinic_db_data:
